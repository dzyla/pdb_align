name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # One macOS run: it defaults to the `spawn` start method, so it is
          # the only way to catch a parallel path that only works under fork.
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Show resolved environment
        run: python -c "import numpy, scipy, gemmi, Bio, pandas, sys; print(sys.version); [print(m.__name__, m.__version__) for m in (numpy, scipy, gemmi, Bio, pandas)]"

      - name: Run tests
        run: python -m pytest -v --durations=10

  core-install:
    # The package must work with only its required dependencies: numba,
    # seaborn and the reference implementations are all optional, and a core
    # install used to fail on `pdb_align --plot` (seaborn) among other things.
    name: core install only (no optional extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e . pytest

      - name: numba must not be installed
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('numba') is not None)"

      - name: CLI works end to end, including the plot flags
        run: |
          pdb_align --version
          pdb_align tests/data/1ubq.pdb tests/data/1crn.pdb
          pdb_align tests/data/1ubq.pdb tests/data/1crn.pdb --json > out.json
          python -c "import json; d=json.load(open('out.json')); assert d['rmsd'] > 0; assert 'quality' in d"
          pdb_align tests/data/4hhb_bb.pdb tests/data/4hhb_bb.pdb --plot p.png --summary-plot s.png --csv r.csv -o aligned.pdb --save res.npz
          python -c "import os; [os.stat(f) for f in ('p.png','s.png','r.csv','aligned.pdb','res.npz')]"

      - name: The whole suite must run on a core install
        # Tests needing an optional extra skip themselves; nothing may fail.
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check pdb_align webapp struct_pair_align.py tests

  build:
    name: build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: The wheel must carry the licence and the type marker
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith("py.typed") for n in names), names
          assert any("LICENSE" in n for n in names), names
          print("ok:", wheel)
          PY
